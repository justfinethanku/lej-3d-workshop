name: package
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile skill/lej-3d-workshop/scripts/verify_cadquery.py
      - run: python scripts/package.py
