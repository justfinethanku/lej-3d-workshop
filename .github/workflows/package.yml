name: package
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile skill/lej-3d-workshop/scripts/verify_cadquery.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py
  cad-verifier:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-cad.txt
      - run: python -m pip install -r tests/requirements-cad.txt
      - run: python -c "import cadquery, numpy, trimesh"
      - run: python -m unittest discover -s tests -v
